# Keg Monitor Dashboard
# Add this to Home Assistant via Settings → Dashboards → Add Dashboard → YAML

title: Keg Monitor
path: keg-monitor
icon: mdi:beer

cards:
  - type: gauge
    entity: sensor.keg_level
    min: 0
    max: 100
    unit: "%"
    name: Keg Level

  - type: entities
    title: Keg Details
    entities:
      - entity: sensor.keg_remaining
        name: Liters Remaining
      - entity: sensor.flow_rate
        name: Flow Rate
      - entity: sensor.total_volume
        name: Dispensed
